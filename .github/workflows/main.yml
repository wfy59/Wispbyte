name: Wispbyte 自动重启

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定邮箱账号（留空运行全部，多个用逗号分隔）'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

jobs:
  restart:
    name: 执行重启脚本
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: 记录开始时间
        run: echo "START_TS=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl gnupg
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase pyvirtualdisplay requests

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行重启脚本
        env:
          WISPBYTE_1: ${{ secrets.WISPBYTE_1 }}
          WISPBYTE_2: ${{ secrets.WISPBYTE_2 }}
          WISPBYTE_3: ${{ secrets.WISPBYTE_3 }}
          WISPBYTE_4: ${{ secrets.WISPBYTE_4 }}
          WISPBYTE_5: ${{ secrets.WISPBYTE_5 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INPUT_ACCOUNTS: ${{ inputs.accounts }}
        run: python -u scripts/main.py

      - name: 写入本次运行时间并推送
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          TZ=Asia/Shanghai
          export TZ
          END_TS=$(date +%s)
          START_TS=${START_TS:-$END_TS}
          DURATION=$((END_TS - START_TS))
          START_LOCAL=$(date -d "@$START_TS" +"%Y-%m-%d %H:%M:%S")
          END_LOCAL=$(date -d "@$END_TS" +"%Y-%m-%d %H:%M:%S")

          cat > run_time_wispbyte.txt <<EOF
          最近一次运行
          开始时间: ${START_LOCAL} (Asia/Shanghai)
          结束时间: ${END_LOCAL} (Asia/Shanghai)
          耗时: ${DURATION} 秒
          结果: ${JOB_STATUS}
          运行编号: ${{ github.run_number }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_time_wispbyte.txt
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 Wispbyte 最近一次运行时间 [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2